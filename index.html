<script>
(function(){
  // Abertura: o logótipo desenha-se na primeira visita da sessão à página inicial.
  var el=document.getElementById('abertura'),guardado=false;
  try{guardado=sessionStorage.getItem('cdb-abertura')==='1';}catch(e){}
  if(guardado||location.pathname!=='/'||matchMedia('(prefers-reduced-motion: reduce)').matches){el.remove();return;}
  try{sessionStorage.setItem('cdb-abertura','1');}catch(e){}
  var html=document.documentElement;html.style.overflow='hidden';html.dataset.abertura='a';el.classList.add('a');
  var feito=false;
  function fechar(){
    if(feito)return;feito=true;el.classList.add('fim');html.style.overflow='';html.dataset.abertura='fim';dispatchEvent(new Event('cdb:abertura'));
    setTimeout(function(){el.remove();},1600);
  }
  var minimo=new Promise(function(r){setTimeout(r,3400);});
  var carregado=new Promise(function(r){document.readyState==='complete'?r():addEventListener('load',r);});
  Promise.all([minimo,carregado]).then(fechar);
  setTimeout(fechar,7000); // nunca prender o visitante se a rede for lenta
  el.addEventListener('click',fechar);
  addEventListener('keydown',fechar,{once:true});
})();
</script>
